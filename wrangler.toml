name = "serverless-motd-fetcher-worker"
main = "packages/worker/src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# Scheduled Cron Trigger - runs every 5 minutes on Cloudflare Free Tier
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare D1 Database binding
# Wrangler automatically resolves database_id by database_name in your Cloudflare account
[[d1_databases]]
binding = "DB"
database_name = "mc_motd_db"

[vars]
ENVIRONMENT = "production"
DEFAULT_CRON_INTERVAL = "5m"

# Secrets required (configure in Cloudflare Dashboard or via CLI):
# wrangler secret put DISCORD_TOKEN
# wrangler secret put API_SECRET
